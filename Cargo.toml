[package]
name = "halftone"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Turn images into ANSI/ASCII splash art, right in your terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devonoel/halftone"
keywords = ["ascii-art", "ansi", "image", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
image = "0.25.10"
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
